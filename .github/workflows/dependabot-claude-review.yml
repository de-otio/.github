# =============================================================================
# Reusable workflow: Dependabot auto-merge (semver-based)
# =============================================================================
# Auto-merges Dependabot PRs for semver-MINOR and semver-PATCH bumps once the
# calling repo's required status checks are green. MAJOR bumps are always left
# for a human — no automated review of any kind is attempted for them, so
# there's nothing to fail or time out on that path.
#
# History: this workflow previously ran a per-PR supply-chain review via
# anthropics/claude-code-action on AWS Bedrock (OIDC). That action's own
# internal OIDC->app-token exchange started failing with a 401 ("Invalid OIDC
# token") — unrelated to the Bedrock credentials, which succeeded fine — and
# since the review step never completed, auto-merge never got enabled for ANY
# consuming repo, including on routine, safe patch/minor bumps. Diagnosed via
# de-otio/claude-stats, 2026-07-03.
#
# dot-ops had already reached the same conclusion independently
# (docs/deploy-health.md, retired 2026-07-01): a per-PR claude-code-action
# review is "too costly per PR for its value." This workflow now matches
# dot-ops's own proven dependabot-automerge.yml pattern: plain semver-based
# auto-merge, no AWS, no OIDC, no third-party model-invoking action. See the
# "Threat model" section in this repo's README for the trade-off being made.
#
# A best-effort, non-blocking npm-signature check is kept (cheap, no external
# service dependency) — it's advisory only and never blocks the merge.
#
# Calling repo example (unchanged — no caller needs to update anything):
#
#   name: Dependabot review
#   on:
#     pull_request_target:
#       types: [opened, synchronize, reopened]
#   permissions:
#     contents: write
#     pull-requests: write
#     id-token: write
#   jobs:
#     review:
#       if: github.actor == 'dependabot[bot]'
#       uses: de-otio/.github/.github/workflows/dependabot-claude-review.yml@main
# =============================================================================

name: Dependabot auto-merge (reusable)

on:
  workflow_call:
    inputs:
      # The following four inputs are no longer used now that the Claude/
      # Bedrock review step is gone. Kept (accepted, ignored) purely so any
      # existing caller that explicitly passes them doesn't get an "unexpected
      # input" error — removing an input from workflow_call is a breaking
      # change for callers, adding one back is not.
      bedrock-role-arn:
        description: "Unused — retained for caller backward-compatibility only, see workflow header"
        type: string
        default: ""
      bedrock-region:
        description: "Unused — retained for caller backward-compatibility only, see workflow header"
        type: string
        default: ""
      claude-model:
        description: "Unused — retained for caller backward-compatibility only, see workflow header"
        type: string
        default: ""
      max-turns:
        description: "Unused — retained for caller backward-compatibility only, see workflow header"
        type: string
        default: ""
      automerge-method:
        description: Merge method for auto-merge (squash|merge|rebase)
        type: string
        default: squash

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ──────────────────────────────────────────────────────────────────────
      # Provenance: npm audit signatures (best-effort, doesn't block).
      # Verifies sigstore/registry signatures on the new package version.
      # Cheap, no external service dependency, kept from the prior version.
      # ──────────────────────────────────────────────────────────────────────
      - name: Setup Node (for npm audit signatures)
        if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: npm audit signatures
        if: steps.meta.outputs.package-ecosystem == 'npm_and_yarn'
        continue-on-error: true
        run: |
          npm audit signatures --registry https://registry.npmjs.org \
            > /tmp/audit-signatures.txt 2>&1 || true
          cat /tmp/audit-signatures.txt

      # ──────────────────────────────────────────────────────────────────────
      # Semver-based auto-merge. Majors are intentionally left alone below —
      # no label, no comment, no external call — they simply wait for a human
      # to review and merge by hand.
      # ──────────────────────────────────────────────────────────────────────
      - name: Enable auto-merge for minor/patch bumps
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --${{ inputs.automerge-method }} "$PR_URL"
          echo "Auto-merge enabled. GitHub will merge once required checks pass."
