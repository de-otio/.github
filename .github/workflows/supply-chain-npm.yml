# =============================================================================
# Reusable workflow: npm dependency supply-chain checks
# =============================================================================
# Vendored from de-otio/trellis ci.yml job `supply-chain` (commit 2a9304d,
# trellis #337 and #339). npm repos ONLY: it reads package-lock.json. Plan:
# dot-notes plans/pocock-brakes-and-dependabot-2026-11.md (W3). DRAFT.
#
#   - npm-config + registry-host: no tracked .npmrc / npm-shrinkwrap.json, and
#     every installable lockfile entry has the `resolved` (on registry.npmjs.org,
#     matching its own path) and `integrity` npm would have written. No install,
#     under a second, runs before any install.
#   - npm audit signatures: verifies registry signatures and provenance of the
#     INSTALLED tree (`npm ci --ignore-scripts`, so no install script of an
#     untrusted lockfile runs). Only when the lockfile changed.
#   - flags.mjs: new packages, new install scripts, dropped provenance against the
#     base lockfile. Informational here: labelling a PR is the merge gate's job
#     (dependabot-gate.yml), because a Dependabot pull_request token is read-only.
#
# A repo that tracks an `.npmrc` (scoped registries, private feeds) FAILS the
# first step on purpose; that is an owner decision per repo, not something this
# workflow papers over.
#
# To make it count as a required check, call it from the repo's ci.yml and add
# the job to the `ci-required` needs list; as a standalone workflow it only
# reports (see the caller drafts).
#
# CALLER:
#
#   name: Supply chain
#   on:
#     pull_request:
#     merge_group:
#   permissions: {}
#   jobs:
#     supply-chain:
#       permissions:
#         contents: read
#       uses: de-otio/.github/.github/workflows/supply-chain-npm.yml@main
#       with:
#         scripts-ref: main
#
# RUNNER: `vars.CI_RUNNER` for PRIVATE repos only, else ubuntu-latest. This runs
# on `pull_request`, including fork PRs on public repos; the guard keeps those off
# the self-hosted runner.
# =============================================================================

name: Supply chain checks, npm (reusable)

on:
  workflow_call:
    inputs:
      scripts-ref:
        description: >-
          Ref of de-otio/.github the check scripts are checked out from. Keep it
          equal to the ref the workflow itself is pinned to (a SHA, once merged).
        type: string
        default: main
      node-version:
        description: Node.js version for `npm ci` and `npm audit signatures`
        type: string
        default: "22"

permissions: {}

jobs:
  supply-chain:
    name: supply-chain
    runs-on: ${{ (github.event.repository.private && vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Beats any project-level .npmrc for the default registry, so `npm ci` and
      # `npm audit signatures` cannot be pointed elsewhere by a file in the PR.
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      # The caller's code under test. Depth 2 so HEAD^1 (the base tip, on
      # pull_request and merge_group) exists for the lockfile comparison.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # The check scripts, from the org repo, into a separate directory: a PR to
      # the caller repo cannot edit the code that vets it.
      - name: Check out the check scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: de-otio/.github
          ref: ${{ inputs.scripts-ref }}
          path: .org-github
          sparse-checkout: dependabot/scripts
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      # Both checks below must stay BEFORE `npm ci`: a git or file dependency
      # (rejected by registry-host) can run its `prepare` script at install, and
      # a tracked .npmrc changes what the install does.
      - name: No tracked .npmrc or npm-shrinkwrap.json
        timeout-minutes: 2
        run: node .org-github/dependabot/scripts/supply-chain/npm-config.mjs

      - name: Lockfile resolves only from registry.npmjs.org, pinned per entry
        timeout-minutes: 2
        run: node .org-github/dependabot/scripts/supply-chain/registry-host.mjs package-lock.json

      - name: Did package-lock.json change?
        id: lock
        run: |
          set -euo pipefail
          # Any failure to diff (no parent commit) counts as "changed".
          if git diff --quiet HEAD^1 HEAD -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package-lock.json is unchanged: skipping install, signature audit and flags."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies (no install scripts)
        if: steps.lock.outputs.changed == 'true'
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify registry signatures and provenance
        if: steps.lock.outputs.changed == 'true'
        timeout-minutes: 5
        run: npm audit signatures

      - name: Supply-chain flags vs base (informational)
        if: steps.lock.outputs.changed == 'true' && github.event_name == 'pull_request'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          git show HEAD^1:package-lock.json > "$RUNNER_TEMP/base-package-lock.json"
          if ! node .org-github/dependabot/scripts/supply-chain/flags.mjs "$RUNNER_TEMP/base-package-lock.json" package-lock.json; then
            echo "::warning::flags.mjs could not run; the merge gate treats that as not safe to merge unattended."
          fi
